<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./src/style.css" rel="stylesheet">
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.1/cdn/themes/light.css" />
      <script type="module" src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.1/cdn/shoelace-autoloader.js" defer></script>
      <script src="https://kit.webawesome.com/9e9f882dd7754b4e.js" crossorigin="anonymous"></script>
      <title>dr-mario-remake</title>
  </head>


  <body class="bg-[#f7f4ea] text-[#17251f] flex flex-col min-h-screen">
      <header class="sticky top-0 z-50 bg-[#f7f4ea]/95 backdrop-blur border-b border-[#17251f1c]">
          <nav aria-label="main-nav" class="max-w-310 mx-auto px-4 sm:px-7 h-[72px] flex items-center justify-between gap-4 relative">
              <a href="/" data-link class="flex items-center gap-2.5 font-extrabold text-sm tracking-tight text-[#17251f] no-underline hover:text-[#17251f]">
                  <span class="block w-8.5 h-5 rounded-full bg-[#ff6257] border-2 border-[#17251f] overflow-hidden -rotate-35"><span class="block w-1/2 h-full bg-[#fffdf8] border-r-2 border-[#17251f]"></span></span>
                  DR. MARIO REMAKE
              </a>
              <!-- mobile menu toggle (CSS only, replaces <details>) -->
              <input id="nav-toggle" type="checkbox" class="peer sr-only" aria-label="Toggle menu">

              <!-- hamburger, mobile only -->
              <label for="nav-toggle"
                     class="md:hidden grid place-items-center w-10 h-10 rounded-full border border-[#17251f1c] bg-white/50 cursor-pointer transition duration-150 ease-out hover:bg-white peer-focus-visible:outline-2 peer-focus-visible:outline-[#8271e8]"
                     aria-hidden="true">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#17251f" stroke-width="2" stroke-linecap="round">
                      <path d="M4 7h16M4 12h16M4 17h16"/>
                  </svg>
              </label>

              <div class="hidden peer-checked:flex md:flex ...">

              <div class="hidden peer-checked:flex md:flex absolute md:static left-0 right-0 top-full md:top-auto bg-[#f7f4ea] md:bg-transparent border-b md:border-0 border-[#17251f1c] px-4 py-4 md:p-0 flex-col md:flex-row md:items-center gap-3 md:gap-8 md:flex-1 md:justify-between">
                  <div class="flex flex-col md:flex-row gap-3 md:gap-8 md:mx-auto text-base font-bold">
                      <a href="/main-menu" data-link
                         class="inline-block text-[#17251f]! no-underline! transition duration-150 ease-out hover:text-[#ff6257]! hover:-translate-y-0.5">Play</a>
                      <a href="/#community"
                         class="inline-block text-[#17251f]! no-underline! transition duration-150 ease-out hover:text-[#ff6257]! hover:-translate-y-0.5">Community</a>
                      <a href="/#shop"
                         class="inline-block text-[#17251f]! no-underline! transition duration-150 ease-out hover:text-[#ff6257]! hover:-translate-y-0.5">Shop</a>
                  </div>



                  <div class="flex items-center gap-2.5">
                      <wa-button
                              id="a11y-btn"
                              appearance="plain"
                              pill
                              size="small"
                              aria-label="Display and accessibility"
                              aria-haspopup="dialog"
                              aria-controls="a11y-dialog"
                              class="
                                transition duration-150 ease-out hover:-translate-y-0.5
                                [&::part(base)]:bg-white/50!
                                [&::part(base)]:border!
                                [&::part(base)]:border-solid!
                                [&::part(base)]:border-[#17251f1c]!
                                [&::part(base)]:shadow-none!
                                [&::part(base)]:p-1.5!
                                [&::part(base)]:min-h-0!
                                [&::part(label)]:p-0!
                                [&:hover::part(base)]:bg-white!
                            ">
                          <wa-avatar initials="AA" label="" class="[--size:1.75rem]"></wa-avatar>
                      </wa-button>

                      <!-- TODO: put this in the main menu, people without an account can't see the money -->
<!--                      &lt;!&ndash; wallet &ndash;&gt;-->
<!--                      <div id="wallet" class="inline-flex items-center gap-1.5 rounded-full border border-[#17251f1c] bg-white/50 px-3.5 py-2.5 font-mono text-[13px] font-medium text-[#17251f]" aria-label="Your coins">-->
<!--                          <svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#e7ad00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M14.8 8.5c-.7-.6-1.5-.9-2.7-.9-1.5 0-2.6.8-2.6 1.9 0 3 5.3 1.2 5.3 4.5 0 1.3-1.1 2.3-2.8 2.3-1.2 0-2.3-.4-3.1-1.1M12 5.5v13"/></svg>-->
<!--                          <b id="wallet-coins" class="font-medium">1,200</b>-->
<!--                      </div>-->
                      <wa-button
                              id="sign-in-btn"
                              href="/login-signUp"
                              data-link
                              pill
                              size="small"
                              class="
                                 transition duration-150 ease-out hover:-translate-y-0.5
                                [&::part(base)]:bg-[#17251f]
                                [&::part(base)]:border-[#17251f]
                                [&::part(base)]:text-[#fffdf8]
                                [&::part(base)]:font-bold
                                [&:hover::part(base)]:bg-[#ff6257]
                                [&:hover::part(base)]:border-[#ff6257]
                                [&:hover::part(base)]:text-[#17251f]
                            ">
                          Sign in
                      </wa-button>
                  </div>
              </div>
          </nav>
      </header>

      <!--    This is where all page content will be loaded-->
      <div id="app" class="w-full flex-1"></div>

      <footer class="border-t border-[#17251f1c] bg-[#f7f4ea] text-[#66716b]">
          <div class="max-w-295 mx-auto min-h-28 px-7 py-6 flex flex-col md:flex-row justify-between items-center gap-3 text-[11px]">
              <div class="flex items-center gap-2.5 text-[#17251f]"><span class="block w-8.5 h-5 rounded-full bg-[#ff6257] border-2 border-[#17251f] overflow-hidden -rotate-35"><span class="block w-1/2 h-full bg-[#fffdf8] border-r-2 border-[#17251f]"></span></span><strong>DR. MARIO REMAKE</strong></div>
              <p class="m-0! text-center">Built for curious minds and quick fingers.</p>
              <span class="font-mono text-[9px]">&copy; 2025 FAN PROJECT &middot; ALL RIGHTS RESERVED TO NINTENDO</span>
          </div>
      </footer>

      <wa-dialog id="a11y-dialog" label="Display &amp; accessibility" light-dismiss>
          <div class="flex flex-col gap-5 text-[#17251f]">
              <wa-radio-group id="a11y-theme" label="Theme" orientation="horizontal" value="auto">
                  <wa-radio value="auto">Auto</wa-radio>
                  <wa-radio value="light">Light</wa-radio>
                  <wa-radio value="dark">Dark</wa-radio>
              </wa-radio-group>
              <wa-radio-group id="a11y-text" label="Text size" orientation="horizontal" value="normal">
                  <wa-radio value="normal">Normal</wa-radio>
                  <wa-radio value="large">Large</wa-radio>
                  <wa-radio value="xlarge">Extra large</wa-radio>
              </wa-radio-group>
              <wa-switch id="a11y-motion">Reduce motion</wa-switch>
              <wa-switch id="a11y-contrast">High contrast</wa-switch>
              <wa-switch id="a11y-shapes">Colour-blind shapes</wa-switch>
          </div>
          <wa-button slot="footer" variant="brand" data-dialog="close">Done</wa-button>
      </wa-dialog>

      <script type="module" src="/src/main.ts"></script>
  </body>
</html>
